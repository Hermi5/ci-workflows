name: deploy-production

# Production release. The caller triggers this on a `v*` tag and nothing else.
#
# WHY ACTIONS OWNS PRODUCTION WHILE WORKERS BUILDS OWNS STAGING. Workers Builds
# has no approval gate, no ordering guarantee against `drizzle-kit migrate`, and
# nowhere to put a smoke test between upload and promote. All three exist here:
# the job is one serialized sequence: snapshot, migrate, upload without traffic,
# smoke, promote.
#
# Production secrets belong only to the production environment. A tag must pass
# read-only exact-commit/main acceptance before that environment is entered.
# Owner and agent credentials still need distinct authority: this source check
# cannot establish human approval when they share the same owner identity.
#
# WHAT THIS COSTS. Production is a *rebuild of the tagged commit*, not a
# byte-identical promotion of the staging binary. Mitigated by the lockfile, the
# pinned Node major and the same build image; the fallback is `wrangler rollback`
# (100 versions retained).
#
# EXPAND/CONTRACT IS MANDATORY. A Worker version includes bindings but does not
# rewind external database contents, so a rollback across a destructive migration
# leaves the old code pointed at the new schema. Every migration must work
# against both the old and the new code.

on:
  workflow_call:
    inputs:
      ci-ref:
        description: "Full commit SHA of this workflow and its eligibility script"
        type: string
        required: true
      node-version:
        type: string
        required: false
        default: "24"
      package-manager:
        type: string
        required: false
        default: auto
      has-db:
        description: "Take a pg_dump snapshot and run drizzle-kit migrate before deploying"
        type: boolean
        required: false
        default: false
      pg-major:
        description: >-
          Major version of the production Postgres. pg_dump refuses a server
          newer than itself, and the runner image ships 16, so the matching
          client is installed from the PGDG repository before the snapshot.
        type: string
        required: false
        default: "18"
      environment:
        description: "GitHub environment holding production secrets and tag restrictions"
        type: string
        required: false
        default: production
      smoke-path:
        description: "Path fetched on the version preview URL before promoting"
        type: string
        required: false
        default: /
      smoke-marker:
        description: >-
          String that must appear in the smoke response body. Empty checks the
          status only, which is a weaker gate: a 200 error page passes it.
        type: string
        required: false
        default: ""
    secrets:
      CF_ACCESS_CLIENT_ID:
        description: Access service token id, sent on the smoke request when the Worker's previews sit behind Access
        required: false
      CF_ACCESS_CLIENT_SECRET:
        description: Access service token secret for the smoke request
        required: false

permissions:
  contents: read
  actions: read

# Never cancel a release in flight. Cancelling between `versions upload` and
# `versions deploy` leaves an uploaded version that carries no traffic and a
# migration that has already run.
concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate CI revision
        env:
          CI_REF: ${{ inputs.ci-ref }}
        run: '[[ "$CI_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hermi5/ci-workflows
          ref: ${{ inputs.ci-ref }}
          persist-credentials: false
      - name: Require accepted main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release.py

  release:
    name: release
    needs: eligibility
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Check out the immutable commit validated by eligibility, even if the
      # owner moves the tag while this run is waiting.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: Hermi5/ci-workflows/actions/setup-runtime@d8cbb15e697c67d2da65550bf68c04f4885a5964
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}

      # `opennextjs-cloudflare build` runs `next build` and then bundles
      # `.open-next/worker.js`, which is what `wrangler versions upload` uploads.
      # A bare `next build` would leave nothing to upload.
      - name: Build
        run: npx --no-install opennextjs-cloudflare build

      # The runner image ships PostgreSQL 16 and `pg_dump` "cannot dump from
      # PostgreSQL servers newer than its own major version; it will refuse to
      # even try". The matching client comes from the PGDG repository.
      - name: PostgreSQL client matching the server
        if: inputs.has-db
        env:
          PG_MAJOR: ${{ inputs.pg-major }}
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version

      # A snapshot before a migration, kept for 30 days. `--no-owner --no-acl`
      # so the dump restores into a fresh database without the production roles
      # existing. The versioned binary, not the Debian wrapper, which picks a
      # version by local cluster and there is none.
      - name: Snapshot the production database
        if: inputs.has-db
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          PG_MAJOR: ${{ inputs.pg-major }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_PRODUCTION:-}" ]; then
            echo "::error::has-db is true but DATABASE_URL_PRODUCTION is not set"
            exit 1
          fi
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --no-owner --no-acl --format=custom \
            --file="snapshot-${GITHUB_REF_NAME}.dump" "$DATABASE_URL_PRODUCTION"
          ls -lh "snapshot-${GITHUB_REF_NAME}.dump"

      - name: Upload the snapshot
        if: inputs.has-db
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-snapshot-${{ github.ref_name }}
          path: snapshot-*.dump
          retention-days: 30
          if-no-files-found: error

      # The secret carries libpq's form (`sslmode=verify-full&sslrootcert=system`),
      # which pg_dump above needs. drizzle-kit's driver, postgres.js, forwards
      # unknown URL parameters to the server as options, and PlanetScale answers
      # `unrecognized configuration parameter "sslrootcert"` (found 2026-09-08).
      # So the driver gets the same URL minus that one parameter; verify-full
      # still applies, postgres.js verifies against the system store.
      - name: Migrate
        if: inputs.has-db
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          url="${DATABASE_URL_PRODUCTION//&sslrootcert=system/}"
          url="${url//\?sslrootcert=system&/?}"
          DATABASE_URL="$url" npx --no-install drizzle-kit migrate

      # Upload without promoting. The new version exists and is reachable on its
      # own preview URL; live traffic still goes to the previous one.
      - name: Upload the version
        id: upload
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          npx --no-install opennextjs-cloudflare upload -- --tag "$GITHUB_REF_NAME" --message "release $GITHUB_REF_NAME" \
            2>&1 | tee "$RUNNER_TEMP/opennext-upload.log"

      # The whole reason production is not Workers Builds: something runs between
      # upload and promote. A version that 500s never carries traffic.
      # Version previews are their own workers.dev hostnames; when the Worker's
      # previews sit behind Access, the smoke request carries the service token
      # or it meets a login page. Empty secrets send no header.
      - name: Smoke the version preview
        id: smoke
        env:
          SMOKE_PATH: ${{ inputs.smoke-path }}
          SMOKE_MARKER: ${{ inputs.smoke-marker }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          COMMAND_OUTPUT="$(cat "$RUNNER_TEMP/opennext-upload.log")"
          access_args=()
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            access_args=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          # `|| true` on both: under pipefail a no-match grep would end the step
          # before the explanations below (a release died that way 2026-09-09).
          version_id="$(printf '%s' "$COMMAND_OUTPUT" | grep -oE 'Version ID:[[:space:]]*[0-9a-f-]{36}' | grep -oE '[0-9a-f-]{36}' | tail -1 || true)"

          if [ -z "$version_id" ]; then
            echo "::error::no Worker Version ID in the wrangler output; refusing to promote"
            exit 1
          fi
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"
          preview="$(printf '%s' "$COMMAND_OUTPUT" | grep -oE "https://${version_id:0:8}-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev" | tail -1 || true)"

          if [ -z "$preview" ]; then
            echo "::error::no version preview URL in the wrangler output; refusing to promote an unsmoked version. Version previews are a Worker trigger: enable \`preview_urls\` in wrangler.jsonc and apply it once with \`wrangler triggers deploy\` (or a first \`wrangler deploy\`); \`versions upload\` alone never turns them on."
            exit 1
          fi

          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 ${access_args[@]+"${access_args[@]}"} "${preview}${SMOKE_PATH}")"
          echo "smoke: $preview$SMOKE_PATH -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::smoke test returned HTTP $code"; exit 1; }

          if [ -n "$SMOKE_MARKER" ]; then
            grep -qF -- "$SMOKE_MARKER" "$body" || {
              echo "::error::smoke marker not found in the response body"
              exit 1
            }
            echo "smoke marker found"
          else
            echo "::warning::no smoke-marker configured; only the status code was checked, and a 200 error page passes that"
          fi

      - name: Promote to 100%
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions deploy ${{ steps.smoke.outputs.version-id }}@100% --yes

      - name: Record what shipped
        if: always()
        env:
          VERSION_ID: ${{ steps.smoke.outputs.version-id }}
        run: |
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo ""
            echo "- commit \`${GITHUB_SHA}\`"
            echo "- worker version \`${VERSION_ID:-none}\`"
            echo "- rollback: \`wrangler rollback\`, or \`wrangler versions deploy <previous-id>@100%\`"
            echo "- rollback selects versioned code/bindings; external database contents are not rewound"
          } >> "$GITHUB_STEP_SUMMARY"
